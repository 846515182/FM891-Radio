<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0718" />
  <title>时光电台</title>
  <meta name="description" content="时光电台 · 拾起耳朵里的好时光" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="时光电台" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="app">
    <!-- v1.20.8：台标回左上角角标，徽章（开播中/在线/曲库）全撤。
         用户原话「把曲库删掉 在线人数也删掉 开播中也删掉 那个头像位置改在左上角」。
         电台该有的样子：一个角标 + 一首歌 + 排队的人，别堆仪表盘。 -->
    <header class="top">
      <div class="brand">
        <img class="brand-avatar" src="icons/dj-avatar.png" alt="时光电台" />
        <span class="brand-logo">时光电台</span>
      </div>
      <p class="slogan">拾起耳朵里的好时光 · MUSIC RADIO</p>
    </header>

    <section class="player" aria-label="播放器">
      <!-- 排队列表搬到左边一栏（透明），下面那一整块删掉（用户：下面就不要显示了） -->
      <aside class="queue-rail" id="queueRail" hidden aria-label="排队">
        <div class="queue-rail-h">排 队</div>
        <ol class="queue-rail-list" id="queueRailList"></ol>
        <p class="queue-rail-empty" id="queueRailEmpty">还没人排队</p>
      </aside>

      <div class="stage">
        <div class="cover" id="cover">
          <!-- 用 <img> 而不是 CSS background：实测这套 WebView 里
               file:// 的 background-image 不渲染（同一张图走 <img> 正常），
               而 background 方案一旦不画，封面就只剩一个空盒子。 -->
          <img class="cover-img" id="coverImg" src="icons/dj-avatar.png" alt="主播" />
          <span class="status" id="status">正在接通直播…</span>
          <div class="cover-ring" aria-hidden="true"></div>
          <svg class="note" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
          <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <h1 id="stationName">时光电台</h1>
        <p class="now-artist" id="nowArtist" hidden></p>
        <p class="desc" id="stationDesc">点一首歌，云端主播放给你听</p>
        <p class="now-title" id="nowTitle"></p>
        <div class="song-meta" id="songMeta" hidden></div>
      </div>

      <!-- v1.20：直播没有「暂停」—— 收音机拧开就一直听，所以不再有播放/暂停按钮。
           进度条现在表示「当前这首播到哪」，由服务端 air.startedAt 驱动（不可拖动）。 -->
      <div class="vod-row" id="vodRow" hidden>
        <span class="vod-time" id="vodCur">0:00</span>
        <span class="vod-track" id="vodTrack" role="slider" aria-label="播放进度" tabindex="0"><i id="vodPct"></i></span>
        <span class="vod-time" id="vodDur">--:--</span>
      </div>

      <section class="volume" aria-label="音量">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="调节音量" />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </section>

      <button class="dj-bubble" id="djBubble" type="button" aria-label="打开在线点歌">
        <span class="dj-face" aria-hidden="true">🎙️</span>
        <span class="dj-text" id="djText">主播在线 · 想听什么就点</span>
        <span class="dj-cta">点歌</span>
      </button>

      <!-- 直播接入提示：正常情况下 App 一打开就连上流并出声，这条是隐藏的。
           只有自动播放被拦 / 断线待救时才露出来，点一下（重新）接上直播。 -->
      <button class="dj-bubble air-bar" id="airBar" type="button" hidden aria-label="接上直播">
        <span class="dj-face" aria-hidden="true">📻</span>
        <span class="dj-text" id="airText">正在开播</span>
        <span class="dj-cta">接上</span>
      </button>
    </section>

    <footer>
      时光电台 · 拾起耳朵里的好时光<br />
      <button class="link-btn" id="checkUpdateBtn" type="button">
        检查更新 · <span id="verLabel">v…</span>
      </button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="dialog-mask" id="updateMask" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="updTitle">
      <h3 id="updTitle">发现新版本 🎉</h3>
      <p class="dialog-ver" id="updVer"></p>
      <p class="dialog-body" id="updBody"></p>
      <div class="upd-progress" id="updProgress" hidden>
        <div class="upd-bar"><i id="updBar"></i></div>
        <p class="upd-pct" id="updPct">0%</p>
      </div>
      <div class="dialog-actions">
        <button class="ghost" id="updLater" type="button">暂不更新</button>
        <button class="primary" id="updGo" type="button">立即更新</button>
      </div>
    </div>
  </div>

  <div class="dialog-mask" id="reqMask" hidden>
    <div class="dialog req-dialog" role="dialog" aria-modal="true" aria-labelledby="reqTitle">
      <!-- 抓手：点歌台现在是贴底的抽屉（用户反馈「不要那个框」）。抓手能拖，
           配上下滑关闭手势，不用去找那个 ✕。 -->
      <div class="dialog-grip" id="reqGrip" aria-hidden="true"><i></i></div>
      <!-- 标题行：右边常驻一个 ✕。以前退出只能靠底部那个「收起」，而弹窗没有
           max-height 也不滚动，点几首歌后队列把弹窗撑出屏幕，那个按钮被顶到
           屏幕外 —— 用户反馈「点完后返回按钮都没有」，等于被困在点歌台里。 -->
      <!-- v1.21.12 头部重排（用户：「点歌那个页面很烂」）。旧版不是缺功能，是**顺序
           反了**：上半屏全是输入区（输入框 + 常听 + 主播性格 + 一整行「点歌」大按钮
           + 折叠区），真正想看的「大家排到哪了、我第几位」被压在屏幕下面，点完歌还得
           滑下去找。现在头一行交代身份与协同（几个人一起点歌 + 昵称入口），第二行就是
           「输入 + 点歌」（主按钮与输入同排，省掉一整行），其余收进「更多」。 -->
      <div class="dialog-head req-head">
        <div class="req-head-l">
          <h3 id="reqTitle">🎧 点歌台</h3>
          <span class="req-live" id="reqLive">正在数人…</span>
        </div>
        <div class="req-head-r">
          <button class="nick-btn" id="nickBtn" type="button">昵称</button>
          <button class="dialog-x" id="reqX" type="button" aria-label="收起点歌台">✕</button>
        </div>
      </div>
      <!-- 昵称编辑：默认收起（点头部「昵称」才展开）。以前它躺在队列底下，改一次昵称
           要滑过整张列表。 -->
      <div class="req-nick" id="reqNickBox" hidden>
        <label for="nickInput">我的昵称</label>
        <input id="nickInput" type="text" maxlength="16" placeholder="别人点歌时看到的名字" />
      </div>
            <form class="req-form req-compose" id="reqForm" autocomplete="off">
        <!-- 输入 + 点歌同一行：这是整个面板唯一的主按钮（省掉一整行的高度） -->
        <div class="req-compose-row">
          <div class="ac-wrap">
            <input id="reqInput" type="text" placeholder="想听哪首歌？主播全网找" maxlength="30" />
            <ul class="ac-list" id="reqAc" hidden></ul>
          </div>
          <button class="primary req-go" id="reqGo" type="submit">点歌</button>
        </div>
        <!-- 曲库常听：横向一排 -->
        <div class="req-chips" id="reqChips" hidden></div>
        <!-- v1.21.12：这里原来还有「送给谁 + 祝福语 + AI 写祝福」。用户原话
             「加一句想说的有啥用，没用就删掉相关的代码」—— 整块移除：控件、AI 祝福
             拉取、云端祝福词本，以及播报文案里的「送给…：…」都一并去掉。 -->
        <details class="req-more">
          <summary>更多 · 主播性格</summary>
          <!-- 主播性格：**你自己选**。时段自动只是兜底（用户原话：用户自己选 DJ 的
               性格，比我们替他决定好得多）。选中值跟着这单一起发给云端。 -->
          <div class="mood-row" id="moodRow" role="radiogroup" aria-label="主播性格">
            <span class="mood-lb">主播</span>
            <button class="mood auto" type="button" data-mood="">自动</button>
            <button class="mood" type="button" data-mood="announce">报幕</button>
            <button class="mood" type="button" data-mood="chat">闲聊</button>
            <button class="mood" type="button" data-mood="night">深夜</button>
          </div>
        </details>
      </form>
      <p class="req-sum" id="reqSum" hidden></p>
      <p class="req-hint" id="reqHint"></p>
      <ul class="req-list" id="reqList"></ul>
      <div class="dialog-actions">
        <button class="ghost" id="reqClose" type="button">收起</button>
      </div>
    </div>
  </div>

  <!-- 选版弹窗（v1.21.11「点歌流程弄成弹窗选择」）：候选版本不再铺在点歌台
       条目里，改弹窗挑。新候选一轮自动弹一次；行内的「选版本」把手随时重开；
       「取消点歌」= 中途撤单（del 墓碑 → 云端中止找歌/换版、必要时下架）。 -->
  <div class="dialog-mask" id="candMask" hidden>
    <div class="dialog cand-dialog" role="dialog" aria-modal="true" aria-labelledby="candTitle">
      <div class="dialog-head">
        <h3 id="candTitle">🎵 挑个版本</h3>
        <button class="dialog-x" id="candX" type="button" aria-label="关闭选版">✕</button>
      </div>
      <p class="req-cands-h" id="candHint">挑一个版本（不挑就用推荐那版）</p>
      <span class="req-cands-list" id="candList"></span>
      <div class="dialog-actions">
        <button class="req-cand-ok" id="candOk" type="button">确定</button>
        <button class="cand-later" id="candLater" type="button">稍后再说</button>
        <button class="cand-cancel" id="candCancel" type="button">取消点歌</button>
      </div>
    </div>
  </div>

  <audio id="audio" preload="none"></audio>
  <script src="mqtt.min.js"></script>
  <script src="app.js"></script>
  <script src="request.js"></script>
</body>
</html>
